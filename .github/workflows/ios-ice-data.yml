name: iOS Ice dictionary package
on:
  push:
    branches: ['fix/ios-buffer-paste-punctuation']
    paths: ['Catalog/input-schemes/ios-ice/**', '.github/workflows/ios-ice-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore verified iOS engine host slice
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            Vendor/ios-build
            Vendor/Rime.xcframework
          key: ios-trollstore-native-${{ runner.arch }}-xcode26.6-${{ hashFiles('platforms/ios/dependencies.lock.json', 'platforms/ios/scripts/**') }}
          fail-on-cache-miss: true
      - name: Prepare packaging tools
        run: |
          python3 -m venv "$RUNNER_TEMP/data-venv"
          "$RUNNER_TEMP/data-venv/bin/pip" install -r scripts/input-schemes/requirements.txt
      - name: Package pinned data and verify import, deployment and candidates
        run: |
          "$RUNNER_TEMP/data-venv/bin/python" Catalog/input-schemes/ios-ice/package.py \
            --output .build/ios-ice-data --cache .build/ios-ice-upstream --verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: XSIME-Ice-Pinyin-9Key
          path: |
            .build/ios-ice-data/*.zip
            .build/ios-ice-data/*.sha256
            .build/ios-ice-data/*.json
            .build/ios-ice-data/*.txt
          if-no-files-found: error
